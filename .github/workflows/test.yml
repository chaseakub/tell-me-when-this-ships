name: Test the Action
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm test
      - name: Verify the skill installs in a clean Codex project
        working-directory: ${{ runner.temp }}
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          mkdir skill-consumer
          cd skill-consumer
          npx --yes skills@1.9.0 add "$GITHUB_WORKSPACE" --skill npm-release-notifier --agent codex -y
          cmp "$GITHUB_WORKSPACE/skills/npm-release-notifier/SKILL.md" .agents/skills/npm-release-notifier/SKILL.md
